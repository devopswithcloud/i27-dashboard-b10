substitutions:
  _REGION: us-central1
  _REPO: gcp-batch28
  _IMAGE: i27-dashboard-b10
  _SERVICE: i27-dashboard-b10
  _PROJECT_ID: 'project-297df0e3-3d6b-40a7-aab'  # Replace with your actual GCP project ID

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}'

steps:
  # Build the image, tagged with the commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}'

  # Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8000'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY



- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'deploy', 'newpython-app', '--image', 'us-central1-docker.pkg.dev/project-297df0e3-3d6b-40a7-aab/gcp-batch28/newpython-app:v1', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']
options: 
  logging: CLOUD_LOGGING_ONLY