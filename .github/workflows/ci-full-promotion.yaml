# ===============================================
# Write a workflow having dev -> staging > producion pipeline
# with approval gate on production
# Environments:
#   development -> no protection
#   staging     -> no protection
#   production  -> requiere reviewers: your github username 
#                   deployment branches: main only
# Finally i should be able to have summary
# development url :
# stagin url:
# production url:
# Docker build.
# image tag: commit sha value , in that only 7 characters should be printing  
# docker push   
# ===============================================
name: Build , test and Push Docker Image
on: 
  push: 
    branches: 
    - master
    paths:
    - 'src/**'
    - 'pom.xml'
    - 'Dockerfile'
  workflow_dispatch: 
env: 
    DOCKER_IMAGE_NAME: 'devopswithcloudhub/i27-devops-dashboard'
jobs:
    # ------------------ Job 1:  Build Test and Package -----------------
    build:
      name: Build Test and Package
      runs-on: ubuntu-latest
      outputs:
        image-tag: ${{ steps.tag.outputs.value }}
      steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build Test and Package
        run: mvn clean package 
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 7
      - name: Docker Image Tag
        id: tag
        run: |
            echo "------------------ Creating Docker Image Tag ---------------------"
            echo "value=${{ github.sha}}" >> $GITHUB_OUTPUT
    #--------------------- Docker Build and Push -------------------------
    docker-build-push:
        name: Docker Build and Push
        runs-on: ubuntu-latest
        needs: build
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with: 
            username: ${{ vars.DOCKERHUB_USERNAME}}
            password: ${{ secrets.DOCKERHUB_TOKEN}}
        - name: List the files and path
          run: |
            echo "Current path is "
            pwd
            echo "List the files in the current path"
            ls -la 
        - name: Build Docker Image
          run: |
            echo "------------------ Building Docker Image  ---------------------"
            docker build \   
                  -t ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} \
                  .
        - name: Push Docker Image
          run: |
            echo "------------------ Pushing Docker Image  ---------------------"
            docker push \
                ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
        - name: Docker Image Details 
          run: |
            echo "-----------------------------------------------------"
            echo "Docker Image Pushed Succesfully"
            echo "-----------------------------------------------------"
            echo "Repository    : ${{env.DOCKER_IMAGE_NAME}}"
            echo "Tag is        : ${{ needs.build.outputs.image-tag }}"
            echo "Full image is : ${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}"
            echo "-----------------------------------------------------"



      

      
