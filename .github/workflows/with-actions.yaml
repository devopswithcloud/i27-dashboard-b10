name: With Actions
on:
  workflow_dispatch:
jobs:
    with-actions:
       runs-on: ubuntu-latest
       steps:
       - name: Checkout the repository
         uses: actions/checkout@v3
       - name: Setup Java 21
         uses: actions/setup-java@v6
         with:
           distribution: 'temurin'
           java-version: '25'
       # composite 
       # actions/* ===> maintained by github
       # docker/*
       # google-git
    